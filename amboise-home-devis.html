<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMBOISE HOME · Devis &amp; Catalogue</title>
<link rel="icon" href="data:,">
<style>
:root{
  --n:#1F2937;--n2:#2C3A4E;--g:#C9A227;--g2:#A8861C;--gt:#FBF3DA;
  --i:#3B465A;--i2:#6C7689;--l:#E3E7EE;--m:#F5F6F9;--w:#FFFDF6;
  --ok:#2F7A4F;--warn:#A8730F;--err:#A83232;
  --sh:0 1px 2px rgba(31,41,55,.05),0 10px 30px -16px rgba(31,41,55,.22);
  --sh2:0 2px 8px rgba(31,41,55,.07),0 24px 50px -22px rgba(31,41,55,.3);
}
*{box-sizing:border-box;margin:0;padding:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--m);color:var(--i);font-size:15px;line-height:1.55}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.hide{display:none!important}

/* ---------- EN-TÊTE ---------- */
header{background:var(--n);color:#fff;padding:0 26px}
.hin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:13px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;background:#fff;border-radius:11px;padding:7px 14px}
.brand img{height:44px;display:block}
.brand .sub{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--i2);border-left:1px solid var(--l);padding-left:12px;line-height:1.8}
.hspacer{flex:1}
.hact{display:flex;gap:8px;flex-wrap:wrap}
.hact .b{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hact .b:hover{background:rgba(255,255,255,.2)}
.hact .b.g{background:var(--g);color:var(--n);border-color:var(--g)}
.hact .b.g:hover{background:var(--g2);color:#fff}

/* ---------- ONGLETS ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:40;box-shadow:0 1px 2px rgba(31,41,55,.05)}
.tabsin{max-width:1180px;margin:0 auto;padding:0 26px;display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;border-bottom:3px solid transparent;padding:13px 18px;font:inherit;font-weight:600;color:var(--i2);cursor:pointer;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;transition:.15s}
.tabs button:hover{color:var(--n)}
.tabs button.on{color:var(--n);border-bottom-color:var(--g)}
.tabs button .n{background:var(--m);color:var(--i2);border-radius:20px;padding:1px 9px;font-size:11.5px;font-weight:800}
.tabs button.on .n{background:var(--gt);color:#6D5710}

/* ---------- MISE EN PAGE ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:24px 26px 60px}
.page{min-height:60vh}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h2{color:var(--n);font-size:24px;letter-spacing:-.2px}
h3{color:var(--n);font-size:16px}
h4{color:var(--n);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.sub{font-size:13px;color:var(--i2);margin-top:5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
.card>h3{margin:-4px 0 16px;padding-bottom:13px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card>h3 .lead{display:flex;align-items:center;gap:9px}
.hint{font-size:12.5px;color:var(--i2);line-height:1.6;margin:-4px 0 14px}
.em{text-align:center;padding:44px 22px;color:var(--i2)}
.grid2{display:grid;grid-template-columns:1.2fr .9fr;gap:18px;align-items:start}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.row.tight{gap:10px}
label{display:block;font-size:12px;font-weight:700;color:var(--n);margin-bottom:5px}
label .opt{font-weight:400;color:var(--i2);text-transform:none}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #CDD3DD;border-radius:9px;font:inherit;background:#fff;color:var(--i);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px rgba(201,162,39,.16)}
input:disabled{background:#F7F8FA;color:var(--i2)}
textarea{min-height:64px;resize:vertical;line-height:1.55}
.calcHint{font-size:11.5px;color:var(--i2);margin-top:5px;display:block}

/* ---------- BOUTONS ---------- */
.b{border:0;background:var(--n);color:#fff;padding:10px 16px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.b:hover{background:var(--n2)}
.b.g{background:var(--g);color:var(--n)}.b.g:hover{background:var(--g2);color:#fff}
.b.o{background:#fff;color:var(--n);border:1px solid #C9CFDA}.b.o:hover{background:var(--m);border-color:var(--n)}
.b.gh{background:none;border:0;color:var(--i2);padding:7px 10px}.b.gh:hover{background:var(--m);color:var(--n)}
.b.xr{background:#fff;color:var(--err);border:1px solid #E6C6C6}.b.xr:hover{background:var(--err);color:#fff;border-color:var(--err)}
.b.s{padding:6px 11px;font-size:13px}
.b:disabled{opacity:.35;cursor:not-allowed}

/* ---------- TABLEAUX ---------- */
.tw{overflow:auto;border-radius:11px;border:1px solid var(--l)}
table.t{width:100%;border-collapse:collapse;background:#fff}
.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--i2);padding:11px 10px;background:var(--m);border-bottom:1px solid var(--l);font-weight:800;white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--l);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover{background:#FCFCFD}
.t .r{text-align:right}
.t .c{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.ref{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--g2);text-transform:uppercase;display:block}

/* ---------- TUILES / PASTILLES ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--m);border:1px solid var(--l);border-radius:11px;padding:14px 15px}
.tile .k{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--i2)}
.tile .v{font-size:20px;font-weight:800;color:var(--n);margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:11px;font-weight:600;color:var(--i2)}
.pill{background:var(--gt);color:#6D5710;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap;display:inline-block}
.pill.mut{background:var(--m);color:var(--i2)}
.pill.ok{background:#EEF5F0;color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #D6DAE2;background:#fff;color:var(--i);padding:7px 13px;border-radius:20px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--n)}
.chip.on{background:var(--n);color:#fff;border-color:var(--n)}
.chip.on b{color:var(--g)}

/* ---------- ÉTAPES ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.st{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--i2);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;flex:1 1 auto;justify-content:center}
.st:hover{border-color:var(--n);background:var(--m)}
.st .dot{width:18px;height:18px;border-radius:50%;background:var(--m);color:var(--i2);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.st.done{color:var(--ok);border-color:#CFE2D6;background:#F4F9F6}
.st.done .dot{background:#DCEBE1;color:var(--ok)}
.st.cur{background:var(--g);border-color:var(--g);color:var(--n)}
.st.cur .dot{background:rgba(255,255,255,.6);color:var(--n)}

/* ---------- FICHE PRODUIT ---------- */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.prod{background:#fff;border:1px solid var(--l);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:.18s}
.prod:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.prod .pv{height:142px;background:linear-gradient(150deg,#F7F8FA,#ECEEF3);position:relative;overflow:hidden;border-bottom:1px solid var(--l)}
.prod .pv img{width:100%;height:100%;object-fit:cover;display:block}
.prod .pv .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.16em;color:#AFB5C1;font-weight:800}
.prod .pv .cat{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.95);padding:4px 11px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--n)}
.prod .pv .cat.none{color:#9AA1AE}
.prod .bd{padding:14px 15px 16px;display:flex;flex-direction:column;flex:1}
.prod .nm{font-size:15px;font-weight:700;color:var(--n);margin:3px 0 6px;line-height:1.35}
.prod .ds{font-size:12.5px;color:var(--i2);line-height:1.55;flex:1}
.prod .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--l)}
.prod .pr{font-size:17px;font-weight:800;color:var(--n);font-variant-numeric:tabular-nums}
.prod .pr small{display:block;font-size:9.5px;font-weight:700;color:var(--i2);letter-spacing:.06em}

/* ---------- APERÇU DOCUMENT ---------- */
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.sheet{width:794px;background:#fff;margin:0 auto 22px;box-shadow:var(--sh2);color:#2B3445;font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;min-height:1123px}
.sheet .body{flex:1;padding:30px 52px 24px}
.sheet .foot{padding:0 52px 22px}
.footin{border-top:1px solid var(--l);padding-top:9px;display:flex;justify-content:space-between;gap:14px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#98A0AF;font-weight:700}
.footin .tag{font-family:Georgia,serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;color:var(--g2);font-weight:400}
.sh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;border-bottom:4px solid var(--g);padding-bottom:18px;gap:20px}
.sh img{width:236px}
.dt{text-align:right;max-width:400px}
.dt .dth{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.dt h1{font-size:29px;color:var(--n);letter-spacing:3.5px;font-weight:800}
.dt .meta{margin-top:12px;display:grid;grid-template-columns:repeat(2,auto);gap:9px 30px;justify-content:end;font-size:12px;color:#5B6577;line-height:1.3}
.dt .meta div{text-align:right}
.dt .meta b{color:var(--n);font-size:12.5px}
.dt .meta span{display:block;color:#98A0AF;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:1px}
.dt .meta.old{display:block;line-height:1.85}
.dt .meta.old span{display:inline;font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;margin:0}
.dt .duo{display:inline-block;margin:0;white-space:nowrap;background:var(--n);color:#fff;padding:5px 13px;border-radius:6px;font-size:11px;font-weight:700}
.pa{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0 4px}
.pb{background:var(--m);border-left:4px solid var(--g);padding:13px 16px;border-radius:0 9px 9px 0}
.pb b{color:var(--n);display:block;margin-bottom:5px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.pb .ln{line-height:1.65}
.sheet .t th{background:var(--n);color:#fff;padding:10px 9px;border:0;font-size:10px}
.sheet .t td{padding:10px 9px;border-bottom:1px solid #EDEFF3}
.sheet .t tbody tr:nth-child(even) td{background:#FAFBFC}
.sheet .t tbody tr:hover{background:transparent}
.sheet .t .des b{display:block;color:var(--n);font-size:12.5px}
.sheet .t .des span{color:#7D8595;font-size:11px;line-height:1.4;display:block;margin-top:2px}
.sheet .t .des i{color:var(--g2);font-style:normal;font-weight:800;font-size:10px;letter-spacing:.06em;margin-right:6px}
.secrow td{background:var(--gt)!important;font-weight:800;color:var(--n);font-size:10px;text-transform:uppercase;letter-spacing:.09em}
.tt{margin:16px 0 0 auto;width:330px}
.tt div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l);font-variant-numeric:tabular-nums}
.tt .f{background:var(--n);color:#fff;padding:12px 14px;font-size:14px;font-weight:700;border:0;border-radius:8px;margin-top:8px;align-items:center}
.tt .f span:last-child{color:var(--g);font-size:19px;font-weight:800}
.tt .sm{display:block;font-size:10.5px;color:#7D8595;border:0;padding-top:8px}
.blk{margin-top:18px}
.blk .p{background:var(--m);border-radius:9px;padding:13px 15px;font-size:11.5px;line-height:1.6;white-space:pre-wrap}
.tl{display:flex;gap:5px;margin:22px 0 4px}
.tl div{flex:1;text-align:center;font-size:9.5px;font-weight:700;padding:9px 3px;border-radius:7px;background:var(--m);color:#98A0AF}
.tl .d{background:#EEF3EE;color:var(--ok)}
.tl .c{background:var(--g);color:var(--n)}
.cgv{font-size:10.5px;color:#7D8595;line-height:1.7;white-space:pre-wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--l)}
.cgv b{color:var(--n);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.sg .s{border:1.5px solid var(--n);border-radius:9px;min-height:112px;padding:12px 14px;font-size:10.5px;color:var(--n);font-weight:700;position:relative;background:#fff}
.sg .s.client .ln2{border-top:1px dotted #B9C0CC;display:block;margin-top:56px;font-weight:400;font-size:9.5px;color:#98A0AF;padding-top:4px}
.sg .s .who{display:block;margin-top:10px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#98A0AF;font-weight:600}
.cachet{position:absolute;right:10px;bottom:10px;width:104px;height:104px;transform:rotate(-7deg);opacity:.92;color:#B0283B;pointer-events:none}
.cachet svg{width:100%;height:100%;display:block}
#stampbox{color:#B0283B;background:#fff;border:1px solid var(--l);border-radius:12px;padding:6px;display:flex;align-items:center;justify-content:center}
#stampbox svg{width:180px;height:180px;display:block}
#stampbox img{max-width:180px;max-height:180px;display:block;mix-blend-mode:multiply}
.cachet img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
input[type=range]{padding:0;accent-color:var(--n)}

/* ---------- MODALE / TOAST ---------- */
.ovl{position:fixed;inset:0;background:rgba(31,41,55,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;z-index:200;overflow:auto}
.mod{background:#fff;border-radius:16px;max-width:680px;width:100%;box-shadow:var(--sh2);overflow:hidden}
.mod .mh{padding:17px 22px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--n);color:#fff}
.mod .mh h3{color:#fff;font-size:17px}
.mod .mh .b.gh{color:#fff;opacity:.8}
.mod .mh .b.gh:hover{background:rgba(255,255,255,.14);color:#fff}
.mod .mb{padding:20px 22px}
.mod .mf{padding:16px 22px;border-top:1px solid var(--l);display:flex;justify-content:flex-end;gap:10px;background:var(--m);flex-wrap:wrap}
.rmlist{list-style:none}
.rmlist li{position:relative;padding:8px 0 8px 24px;border-bottom:1px solid var(--l);font-size:13.5px}
.rmlist li:before{content:"✓";position:absolute;left:0;top:8px;color:var(--err);font-weight:800}
.rmlist li:last-child{border-bottom:0}
.rmlist li b{color:var(--err)}
.rhint{font-size:12.5px;color:var(--i2);line-height:1.6;margin-top:14px;background:var(--m);border-radius:9px;padding:12px 14px}
.rchoice{display:block;width:100%;text-align:left;border:1px solid var(--l);background:#fff;border-radius:11px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;transition:.15s}
.rchoice:hover{border-color:var(--n);box-shadow:var(--sh)}
.rchoice b{display:block;color:var(--n);font-size:14.5px;margin-bottom:3px}
.rchoice span{display:block;font-size:12.5px;color:var(--i2);line-height:1.5}
.opt{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--n);margin-bottom:10px;padding:12px 14px;border:1px solid var(--l);border-radius:11px;cursor:pointer;transition:.15s}
.opt:hover{border-color:#C3C9D4}
.opt:has(input:checked){border-color:var(--g);background:var(--w)}
.opt input{width:auto;margin-top:3px}
.opt .txt{flex:1}
.opt .txt .sm{display:block;font-weight:400;font-size:12.5px;color:var(--i2);margin-top:3px;line-height:1.55}
.help{list-style:none;counter-reset:h}
.help li{position:relative;padding:12px 0 12px 46px;border-bottom:1px solid var(--l);line-height:1.6;font-size:14px}
.help li:last-child{border-bottom:0}
.help li:before{counter-increment:h;content:counter(h);position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:50%;background:var(--gt);color:#6D5710;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.help b{color:var(--n)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--n);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--sh2);z-index:300;max-width:90vw;text-align:center;opacity:0;transition:.28s}
.toast:not(.out){opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1020px){.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  header,.tabsin,.wrap{padding-left:14px;padding-right:14px}
  .brand .sub{display:none}
  .brand img{height:36px}
  .hspacer{display:none}
  .hact{width:100%}
  .card{padding:16px}
  .sheet{width:100%;box-shadow:none;min-height:0}
  .sheet .body{padding:20px}
  .sheet .foot{padding:0 20px 16px}
  .sh img{width:160px}
  .dt h1{font-size:20px;letter-spacing:2px}
  .pa,.sg{grid-template-columns:1fr}
  .cachet{width:82px;height:82px}
}
@media print{
  header,.tabs,.docbar,.noprint,.toast,.ovl{display:none!important}
  body{background:#fff;font-size:11.5px}
  .wrap{max-width:none;margin:0;padding:0}
  .page,.card,.hint{display:none!important}
  #page-doc{display:block!important}
  .sheet{box-shadow:none;margin:0;width:100%;min-height:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sheet .body{padding:0 0 10mm}
  .sheet .foot{padding:0}
  .footin{border-top:0;padding-top:0}
  a{text-decoration:none;color:inherit}
  @page{size:A4;margin:14mm 14mm 11mm}
}

/* ---------- LIVRAISONS / CLIENTS ---------- */
.pill.bl{background:#EAF0F8;color:#2C4E7A}
.pill.er{background:#F8ECEC;color:var(--err)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{background:var(--m);border:1px solid var(--l);border-radius:11px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.wd.now{border-color:var(--g);background:var(--w)}
.wh{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--n);padding:2px 2px 6px;border-bottom:1px solid var(--l)}
.we{color:#B5BBC6;text-align:center;padding-top:16px}
.wi{text-align:left;border:1px solid var(--l);border-left:4px solid var(--g);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;gap:1px;transition:.15s}
.wi:hover{box-shadow:var(--sh)}
.wi b{color:var(--n);font-size:12px}.wi span{color:var(--i2)}
.wi.st-done{border-left-color:var(--ok);opacity:.75}.wi.st-inc{border-left-color:var(--err)}.wi.st-route,.wi.st-prep{border-left-color:#2C4E7A}
.hist li:before{content:"•";color:var(--g2)}

if (!Array.isArray(db.quotes)) db.quotes = [];
if (!Array.isArray(db.categories)) db.categories = [];

/* ---------- Calculs ---------- */
function stageKeys(d) { return STAGES.filter(s => !s.cond || s.cond(d)).map(s => s.k); }
function currentStage(d) { const ks = stageKeys(d); return ks.indexOf(d.stage) > -1 ? d.stage : ks[0]; }
function docTitle(d) {
  const st = currentStage(d);
  if (st === 'devis' || st === 'deco') return 'DEVIS';
  if (st === 'commande') return 'BON DE COMMANDE';
  if (st === 'vente') return 'CONFIRMATION DE VENTE';
  return 'FACTURE';
}
function docLines(d) {
  const out = (d.lines || []).map(l => {
    const q = +l.q || 1, p = +l.p || 0, m = +l.m || 0;
    return { ref: l.ref || '', nom: l.nom || '', unite: l.unite || 'u', desc: l.desc || '', q: q, p: p, m: m, total: q * p * (1 - m / 100) };
  });
  const service = (nom, prix) => { if (+prix) out.push({ ref: '', nom: nom, unite: 'forfait', desc: '', q: 1, p: +prix, m: 0, total: +prix, service: true }); };
  const st = S();
  if (d.deco) service('Conseil d\u00E9coration' + (d.decoNote ? ' \u00B7 ' + d.decoNote : ''), st.prixDeco);
  if (d.livr) {
    const l = LIVRAISONS.filter(x => x.k === d.livr)[0];
    if (l) service(l.label + (d.livrDate ? ' \u00B7 pr\u00E9vue le ' + dateFr(d.livrDate) + (d.livrHeure ? ' \u00E0 ' + d.livrHeure : '') : ''), l.prix(st));
  }
  if (d.montage) service('Montage et installation' + (d.montageNote ? ' \u00B7 ' + d.montageNote : ''), st.prixMontage);
  return out;
}
function totals(d) {
  const L = docLines(d);
  const brut = L.reduce((a, l) => a + l.total, 0);
  const remises = typeof discounts === 'function' ? discounts(d, brut) : [];
  const ht = Math.max(0, brut - remises.reduce((a, r) => a + r.m, 0));
  const taux = +S().tva || 0;
  const tva = ht * taux / 100;
  return { brut: brut, remises: remises, ht: ht, tva: tva, ttc: ht + tva, nb: (d.lines || []).length, unites: (d.lines || []).reduce((a, l) => a + (+l.q || 1), 0) };
}
function validUntil(d) {
  const v = +S().validite || 0;
  if (!v) return null;
  const x = new Date((d.date || today()) + 'T00:00:00');
  x.setDate(x.getDate() + v);
  return x.toISOString().slice(0, 10);
}
const categories = () => {
  const seen = {};
  db.products.forEach(p => { if (p.cat) seen[p.cat] = 1; });
  db.categories.forEach(c => { if (c) seen[c] = 1; });
  return Object.keys(seen).sort((a, b) => a.localeCompare(b, 'fr'));
};

function newQuote() {

  const id = Date.now();

    id: id, numero: 'DV-' + new Date().getFullYear() + '-' + String(db.counter).padStart(4, '0'),

    lines: [], deco: 0, decoNote: '', livr: '', livrDate: '', livrHeure: '', remise: { type: 'pct', val: 0, motif: '' }, promo: '', montage: 0, montageNote: '',

}
function duplicateQuote(id) {

  copy.id = Date.now();

  copy.numero = 'DV-' + new Date().getFullYear() + '-' + String(db.counter).padStart(4, '0');
  copy.date = today();

function deleteQuote(id) {
  if (!confirm('Supprimer d\u00E9finitivement ce dossier ?')) return;

/* ---------- Mutations du dossier ---------- */
function setQuote(k, v) {
  const d = current(); if (!d) return;
  if (k === 'deco' || k === 'montage') { d[k] = v ? 1 : 0; save(); render(); return; }
  if (k === 'livr') { d.livr = v; save(); render(); return; }
  d[k] = v; save();
  if (k === 'date') renderDoc();
}
function setClient(k, v) { const d = current(); if (!d) return; d.client[k] = v; save(); }
function setLine(i, k, v) { const d = current(); if (!d || !d.lines[i]) return; d.lines[i][k] = v; save(); render(); }
function setLineQty(i, v) { const d = current(); if (!d || !d.lines[i]) return; d.lines[i].q = parseQty(v); save(); render(); }
function setLineDiscount(i, v) { const d = current(); if (!d || !d.lines[i]) return; const n = parsePrice(v); d.lines[i].m = Math.min(100, Math.max(0, n)); save(); render(); }
function removeLine(i) { const d = current(); if (!d) return; d.lines.splice(i, 1); save(); render(); }
function addFromSelect() {
  const d = current(); if (!d) return;

  const p = db.products.filter(x => String(x.id) === String(sel.value))[0];

function previewNew(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 1400000) { alert('Image trop lourde (max ~1,3 Mo). Choisissez une image plus l\u00E9g\u00E8re.'); return; }
  const r = new FileReader();
  r.onload = () => {
    const box = document.getElementById('np_shot');
    const hid = document.getElementById('np_img');
    if (hid) hid.value = String(r.result);
    if (box) box.innerHTML = '<img src="' + r.result + '" alt="" style="width:100%;height:100%;object-fit:cover">';
  };
  r.readAsDataURL(f);
}
function clearNew() {
  const hid = document.getElementById('np_img'); if (hid) hid.value = '';
  const box = document.getElementById('np_shot');
  if (box) box.innerHTML = '<span class="ph" style="font-size:10px;letter-spacing:.16em;color:#AFB5C1;font-weight:800">SANS PHOTO</span>';
}

  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

function previewEdit(i, input) {
  const f = input.files && input.files[0];

function saveProduct(i) {
  const p = db.products[i]; if (!p) return;
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  p.ref = g('ep_ref').toUpperCase(); p.nom = g('ep_nom') || p.nom; p.cat = g('ep_cat');
  p.prix = parsePrice(g('ep_prix')); p.desc = g('ep_desc');
  if (p.cat && db.categories.indexOf(p.cat) === -1) db.categories.push(p.cat);
  save(); closeModal(); renderCatalog();
  toast('Produit enregistr\u00E9');
}
function duplicateProduct(i) {
  const p = db.products[i]; if (!p) return;
  const c = JSON.parse(JSON.stringify(p));
  c.id = Date.now(); c.nom = p.nom + ' (copie)';
  db.products.push(c); save(); renderCatalog();
}
function deleteProduct(i) {
  const p = db.products[i]; if (!p) return;
  const uses = db.quotes.filter(q => (q.lines || []).some(l => l.nom === p.nom)).length;
  if (!confirm('Supprimer \u00AB ' + p.nom + ' \u00BB du catalogue ?' +
    (uses ? '\n\nIl appara\u00EEt dans ' + uses + ' dossier(s) : les lignes d\u00E9j\u00E0 saisies sont conserv\u00E9es.' : ''))) return;
  db.products.splice(i, 1); save(); renderCatalog();
}
function loadDemo() {
  if (db.products.length && !confirm('Remplacer le catalogue actuel par le catalogue de d\u00E9monstration ?')) return;
  db.products = DEMO.products.map((p, i) => Object.assign({ id: Date.now() + i, img: '' }, p));
  DEMO.categories.forEach(c => { if (db.categories.indexOf(c) === -1) db.categories.push(c); });
  save(); renderCatalog(); renderQuotes();
  toast('Catalogue de d\u00E9monstration charg\u00E9 : ' + db.products.length + ' produits');
}

/* ---------- Cachet personnalis\u00E9 (PNG) ---------- */
function stampHTML() {
  const s = S();
  return s.cachetImg ? '<img src="' + s.cachetImg + '" alt="Cachet">' : stampSVG();
}
function stampStyle() {
  const s = S();
  if (!s.cachetImg) return '';
  const z = +s.cachetSize || 104;
  return ' style="width:' + z + 'px;height:' + z + 'px;transform:rotate(' + (s.cachetTilt ? '-7deg' : '0deg') + ')"';
}
function importStamp(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) { alert('Choisissez un fichier image (PNG de pr\u00E9f\u00E9rence).'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      try {
        const k = Math.min(1, 600 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k));
        c.height = Math.max(1, Math.round(im.height * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        S().cachetImg = c.toDataURL('image/png');
        S().cachet = 1;
        save(); renderSettings(); renderDoc(); toast('Cachet import\u00E9');
      } catch (e) { alert('Cette image n\u2019a pas pu \u00EAtre import\u00E9e.'); }
    };
    im.onerror = () => alert('Image illisible : essayez avec un fichier PNG.');
    im.src = r.result;
  };
  r.readAsDataURL(f);
  input.value = '';
}
function removeStamp() {
  S().cachetImg = ''; save(); renderSettings(); renderDoc();
  toast('Retour au cachet dessin\u00E9');
}
function setStampSize(v) {
  S().cachetSize = Math.max(50, Math.min(220, +v || 104)); save();
  const el = document.getElementById('st_sz'); if (el) el.textContent = S().cachetSize;
  renderDoc();

/* ---------- Cachet vectoriel ---------- */
const SEG7 = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
function arcPath(cx, cy, r, a0, a1) {
  const steps = Math.max(14, Math.ceil(Math.abs(a1 - a0) * r / 1.3));
  let d = '';
  for (let i = 0; i <= steps; i++) {
    const a = a0 + (a1 - a0) * i / steps;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1);
  }
  return d;
}
function starPath(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return d + 'Z';
}
function stampSVG() {
  const s = S();
  const nom = String(s.nom || 'AMBOISE HOME').toUpperCase();
  const ville = String(s.ville || '').toUpperCase();
  const act = String(s.activite || '').toUpperCase();
  const cx = 130, cy = 130, RO = 110, RI = 95, sw = 2.4;
  let g = '<circle cx="' + cx + '" cy="' + cy + '" r="' + RO + '" fill="none" stroke="currentColor" stroke-width="' + sw + '"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + RI + '" fill="none" stroke="currentColor" stroke-width="' + (sw * 0.55) + '"/>';

  const rN = (RO + RI) / 2;
  const arcTop = arcPath(cx, cy, rN, -Math.PI * 0.88, -Math.PI * 0.12);
  g += '<path id="st_top" d="' + arcTop + '" fill="none"/>' +
    '<text font-size="12.5" font-weight="800" letter-spacing="2" fill="currentColor" font-family="Segoe UI,Arial,sans-serif">' +
    '<textPath href="#st_top" startOffset="50%" text-anchor="middle">' + esc(nom) + '</textPath></text>';
  if (ville) {
    const arcBot = arcPath(cx, cy, rN + 1, Math.PI * 0.86, Math.PI * 0.14);
    g += '<path id="st_bot" d="' + arcBot + '" fill="none"/>' +
      '<text font-size="11" font-weight="700" letter-spacing="1.6" fill="currentColor" font-family="Segoe UI,Arial,sans-serif">' +
      '<textPath href="#st_bot" startOffset="50%" text-anchor="middle">' + esc(ville) + '</textPath></text>';
  }
  g += '<path d="' + starPath(cx - RI + 9, cy, 5) + '" fill="none" stroke="currentColor" stroke-width="1.2"/>' +
    '<path d="' + starPath(cx + RI - 9, cy, 5) + '" fill="none" stroke="currentColor" stroke-width="1.2"/>';

  g += '<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
    '<path d="M' + (cx - 30) + ' ' + (cy - 22) + ' L' + cx + ' ' + (cy - 48) + ' L' + (cx + 30) + ' ' + (cy - 22) + '"/>' +
    '<path d="M' + (cx - 34) + ' ' + (cy - 22) + ' L' + (cx + 34) + ' ' + (cy - 22) + '"/>' +
    '<path d="M' + (cx - 22) + ' ' + (cy - 20) + ' L' + (cx - 22) + ' ' + (cy + 4) + '"/>' +
    '<path d="M' + (cx + 22) + ' ' + (cy - 20) + ' L' + (cx + 22) + ' ' + (cy + 4) + '"/>' +
    '<path d="M' + (cx - 34) + ' ' + (cy + 4) + ' L' + (cx + 34) + ' ' + (cy + 4) + '"/>' +
    '<path d="M' + (cx - 8) + ' ' + (cy + 4) + ' L' + (cx - 8) + ' ' + (cy - 11) + ' L' + (cx + 8) + ' ' + (cy - 11) + ' L' + (cx + 8) + ' ' + (cy + 4) + '"/>' +
    '</g>';

  const annee = String(new Date().getFullYear());
  let d7 = '', x0 = cx - 42, y0 = cy + 24, w = 17, hh = 26, t = 2.4;
  const put = (a1, b1, a2, b2) => { d7 += 'M' + a1 + ' ' + b1 + 'L' + a2 + ' ' + b2; };
  for (let i = 0; i < annee.length; i++) {
    const on = SEG7[+annee.charAt(i)] || '';
    if (on.indexOf('a') > -1) put(x0, y0, x0 + w, y0);
    if (on.indexOf('g') > -1) put(x0, y0 + hh / 2, x0 + w, y0 + hh / 2);
    if (on.indexOf('d') > -1) put(x0, y0 + hh, x0 + w, y0 + hh);
    if (on.indexOf('f') > -1) put(x0, y0, x0, y0 + hh / 2);
    if (on.indexOf('b') > -1) put(x0 + w, y0, x0 + w, y0 + hh / 2);
    if (on.indexOf('e') > -1) put(x0, y0 + hh / 2, x0, y0 + hh);
    if (on.indexOf('c') > -1) put(x0 + w, y0 + hh / 2, x0 + w, y0 + hh);
    x0 += w + 6;
  }
  g += '<path d="' + d7 + '" fill="none" stroke="currentColor" stroke-width="' + t + '" stroke-linecap="round"/>';
  if (act) g += '<text x="' + cx + '" y="' + (cy + 74) + '" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="1" fill="currentColor" font-family="Segoe UI,Arial,sans-serif">' + esc(act) + '</text>';
  if (s.siret) g += '<text x="' + cx + '" y="' + (cy + 88) + '" text-anchor="middle" font-size="8" font-weight="600" fill="currentColor" font-family="Segoe UI,Arial,sans-serif">SIRET ' + esc(s.siret) + '</text>';
  return '<svg viewBox="0 0 260 260" role="img">' + g + '</svg>';
}

function doExport() {
  try {
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'amboise-home-sauvegarde-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Sauvegarde t\u00E9l\u00E9charg\u00E9e');
  } catch (e) { alert('Export impossible dans ce navigateur.'); }
}
function doImport(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o !== 'object') throw new Error('format');
      db = {
        counter: +o.counter || 0, ui: o.ui || {},
        settings: Object.assign({}, DEFAULTS.settings, o.settings || {}),
        products: Array.isArray(o.products) ? o.products : [],
        quotes: Array.isArray(o.quotes) ? o.quotes : [],
        categories: Array.isArray(o.categories) ? o.categories : []
      };
      if (!db.quotes.length && Array.isArray(o.d)) db.quotes = o.d;
      save(); showTab('dos'); render();
      alert('Sauvegarde import\u00E9e : ' + db.quotes.length + ' dossier(s), ' + db.products.length + ' produit(s).');
    } catch (err) { alert('Fichier de sauvegarde invalide.'); }
  };
  r.readAsText(f);
  input.value = '';
}

function setDelStatus(id, st, silent) {
  const q = db.quotes.filter(x => x.id === id)[0]; if (!q) return;
  const d = getDel(q);
  if (st === 'prog' && !d.date) { toast('Indiquez d\u2019abord une date de livraison'); editDelivery(id); return; }
  if (st === 'done' && !silent) { confirmDelivered(id); return; }
  d.statut = st;
  d.hist.push({ t: Date.now(), m: 'Statut : ' + dStat(st).label });
  if (st === 'route' || st === 'prep') { const ks = stageKeys(q); if (ks.indexOf('liv') > -1 && ks.indexOf(currentStage(q)) < ks.indexOf('liv')) q.stage = 'liv'; }
  if (st === 'done') {
    const ks = stageKeys(q);
    q.stage = q.montage && ks.indexOf('inst') > -1 && d.equipe ? 'fin' : 'fin';

const cKey = c => norm(c.nom).replace(/\s+/g, ' ').trim() + '|' + String(c.tel || '').replace(/\D/g, '');
function syncClients() {
  /* Les fiches ne sont plus cr\u00E9\u00E9es automatiquement : on met seulement \u00E0 jour les fiches d\u00E9j\u00E0 li\u00E9es \u00E0 un devis. */
  let changed = false;
  db.quotes.forEach(q => {
    if (!q.clientId || !q.client) return;
    const c = db.clients.filter(x => x.id === q.clientId)[0];
    if (!c) { delete q.clientId; changed = true; return; }
    ['tel', 'mail', 'adresse', 'cp', 'ville'].forEach(k => { if (q.client[k] && !c[k]) { c[k] = q.client[k]; changed = true; } });
  });
  if (changed) save();
}
function clientQuotes(c) { return db.quotes.filter(q => q.clientId === c.id); }
function clientStats(c) {
  const qs = clientQuotes(c);
  const signed = qs.filter(isSigned);
  const ca = signed.reduce((a, q) => a + totals(q).ttc, 0);
  const earned = db.loyalty.actif ? Math.floor(ca * (+db.loyalty.rate || 0)) : 0;
  const adj = (c.mouv || []).reduce((a, m) => a + (+m.pts || 0), 0);
  const tiers = db.loyalty.tiers.slice().sort((a, b) => a.min - b.min);
  let tier = tiers[0], next = null;
  tiers.forEach((t, i) => { if (ca >= t.min) { tier = t; next = tiers[i + 1] || null; } });
  const last = qs.reduce((a, q) => (q.date || '') > a ? q.date : a, '');
  return { qs: qs, signed: signed, ca: ca, earned: earned, pts: Math.max(0, earned + adj), tier: tier, next: next, last: last,
    panier: signed.length ? ca / signed.length : 0, encours: qs.filter(q => currentStage(q) !== 'fin').length };
}

   ENREGISTREMENT DU DEVIS · HEURE DE LIVRAISON · REMISES & CODES PROMO

if (!Array.isArray(db.promos)) db.promos = [];
SVG.tag = '<svg class="i" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>';

/* --- recherche d'un code (promo catalogue ou bon fidélité FID-) --- */
function findCode(code, exceptQuoteId) {
  code = String(code || '').trim().toUpperCase();
  if (!code) return null;
  const p = db.promos.filter(x => String(x.code).toUpperCase() === code)[0];
  if (p) return { kind: 'promo', p: p, label: p.label || ('Code ' + p.code), type: p.type, val: +p.val || 0, min: +p.min || 0 };
  for (let i = 0; i < db.clients.length; i++) {
    const c = db.clients[i];
    const m = (c.mouv || []).filter(x => String(x.code || '').toUpperCase() === code)[0];
    if (m) {
      const v = +m.val || Math.round(-(+m.pts || 0) / (+db.loyalty.valeur || 100) * 10);
      return { kind: 'fid', c: c, m: m, label: 'Bon fid\u00E9lit\u00E9 ' + code, type: 'eur', val: v, min: 0 };
    }
  }
  return null;
}
function codeProblem(info, d, brutTTC) {
  if (!info) return 'Code inconnu';
  if (info.kind === 'promo') {
    const p = info.p;
    if (!p.actif) return 'Code d\u00E9sactiv\u00E9';
    if (p.debut && (d.date || today()) < p.debut) return 'Code valable \u00E0 partir du ' + dateFr(p.debut);
    if (p.fin && (d.date || today()) > p.fin) return 'Code expir\u00E9 le ' + dateFr(p.fin);
    if (+p.max && promoUses(p.code, d.id) >= +p.max) return 'Nombre d\u2019utilisations atteint';
    if (+p.min && brutTTC < +p.min) return 'Montant minimum ' + eur(p.min) + ' TTC';
  } else {
    if (info.m.usedBy && info.m.usedBy !== d.id) return 'Bon d\u00E9j\u00E0 utilis\u00E9';
    if (d.clientId && info.c.id !== d.clientId) return 'Bon r\u00E9serv\u00E9 \u00E0 ' + info.c.nom;
  }
  return '';
}
function promoUses(code, exceptId) {
  code = String(code).toUpperCase();
  return db.quotes.filter(q => q.id !== exceptId && String(q.promo || '').toUpperCase() === code).length;
}
/* --- calcul des remises (sur le HT) --- */
function discounts(d, htBrut) {
  const tva = +S().tva || 0;
  const out = [];
  let base = htBrut;
  const r = d.remise || {};
  if (+r.val > 0) {
    const m = r.type === 'eur' ? Math.min(base, (+r.val) / (1 + tva / 100)) : base * Math.min(100, +r.val) / 100;
    out.push({ label: (r.motif || 'Remise commerciale') + (r.type === 'eur' ? '' : ' (' + num2(r.val).replace(',00', '') + ' %)'), m: m });
    base -= m;
  }
  if (d.promo) {
    const info = findCode(d.promo);
    if (info && !codeProblem(info, d, htBrut * (1 + tva / 100))) {
      const m = info.type === 'eur' ? Math.min(base, info.val / (1 + tva / 100)) : base * Math.min(100, info.val) / 100;
      out.push({ label: info.label + (info.type === 'eur' ? '' : ' (' + num2(info.val).replace(',00', '') + ' %)'), m: m, code: 1 });
      base -= m;
    }
  }
  return out;
}

/* --- gestion des codes promo --- */
function managePromos() {
  let b = '<p class="hint">Les codes s\u2019appliquent sur le total du devis, apr\u00E8s la remise globale. Les bons fid\u00E9lit\u00E9 (FID-\u2026) g\u00E9n\u00E9r\u00E9s depuis les fiches clients sont aussi accept\u00E9s.</p>';
  b += '<div class="tw"><table class="t"><thead><tr><th>Code</th><th>Valeur</th><th>Validit\u00E9</th><th class="r">Utilis\u00E9</th><th>\u00C9tat</th><th></th></tr></thead><tbody>';
  if (!db.promos.length) b += '<tr><td colspan="6" class="em" style="padding:20px">Aucun code promo.</td></tr>';
  db.promos.forEach((p, i) => {
    b += '<tr><td><b style="color:var(--n)">' + esc(p.code) + '</b>' + (p.label ? '<div class="sub" style="margin:0">' + esc(p.label) + '</div>' : '') + '</td>' +
      '<td class="mono">' + (p.type === 'eur' ? eur(p.val) : num2(p.val) + ' %') + (+p.min ? '<div class="sub" style="margin:0">d\u00E8s ' + eur(p.min) + '</div>' : '') + '</td>' +
      '<td class="mono">' + (p.debut ? dateFr(p.debut) : '\u2014') + ' \u2192 ' + (p.fin ? dateFr(p.fin) : '\u221E') + '</td>' +
      '<td class="r mono">' + promoUses(p.code) + (+p.max ? ' / ' + p.max : '') + '</td>' +
      '<td><button class="chip' + (p.actif ? ' on' : '') + '" onclick="togglePromo(' + i + ')">' + (p.actif ? 'Actif' : 'Inactif') + '</button></td>' +
      '<td><button class="b s o xr" onclick="deletePromo(' + i + ')">' + SVG.trash + '</button></td></tr>';
  });
  b += '</tbody></table></div><h4 style="margin:18px 0 8px">Nouveau code</h4>' +
    '<div class="row tight"><div><label>Code</label><input id="pr_code" placeholder="BIENVENUE10" style="text-transform:uppercase"></div>' +
    '<div><label>Libell\u00E9 <span class="opt">(facultatif)</span></label><input id="pr_lab" placeholder="Offre de bienvenue"></div></div>' +
    '<div class="row tight" style="margin-top:10px"><div><label>Valeur</label><input id="pr_val" inputmode="decimal" placeholder="10"></div>' +
    '<div><label>Type</label><select id="pr_type"><option value="pct">% de remise</option><option value="eur">\u20AC TTC</option></select></div>' +
    '<div><label>Minimum TTC <span class="opt">(\u20AC)</span></label><input id="pr_min" inputmode="decimal" placeholder="0"></div>' +
    '<div><label>Utilisations max</label><input id="pr_max" inputmode="numeric" placeholder="illimit\u00E9"></div></div>' +
    '<div class="row tight" style="margin-top:10px"><div><label>D\u00E9but</label><input id="pr_deb" type="date"></div><div><label>Fin</label><input id="pr_fin" type="date"></div></div>';
  openModal('Codes promo', b, '<button class="b o" onclick="closeModal()">Fermer</button><button class="b g" onclick="addPromo()">' + SVG.plus + 'Cr\u00E9er le code</button>', true);
}
function addPromo() {
  const code = val('pr_code').trim().toUpperCase().replace(/\s+/g, '');
  const v = parsePrice(val('pr_val'));
  if (!code) { toast('Indiquez un code'); return; }
  if (!(v > 0)) { toast('Indiquez une valeur'); return; }
  if (findCode(code)) { toast('Ce code existe d\u00E9j\u00E0'); return; }
  const type = val('pr_type');
  if (type === 'pct' && v > 100) { toast('Pourcentage maximum : 100 %'); return; }
  db.promos.push({ code: code, label: val('pr_lab').trim(), type: type, val: v, min: parsePrice(val('pr_min')), max: parseInt(val('pr_max'), 10) || 0, debut: val('pr_deb'), fin: val('pr_fin'), actif: 1, created: Date.now() });
  save(); render(); managePromos(); toast('Code ' + code + ' cr\u00E9\u00E9');
}
function togglePromo(i) { db.promos[i].actif = db.promos[i].actif ? 0 : 1; save(); render(); managePromos(); }
function deletePromo(i) { if (!confirm('Supprimer le code ' + db.promos[i].code + ' ?')) return; db.promos.splice(i, 1); save(); render(); managePromos(); }

/* --- enregistrement du devis --- */
function saveQuote() {
  const d = current(); if (!d) return;
  if (!String(d.client.nom || '').trim()) { toast('Indiquez le nom du client avant d\u2019enregistrer'); focusSoon('f_client'); return; }
  if ((d.livr || d.montage) && d.livrHeure && !d.livrDate) { toast('Indiquez la date de livraison'); return; }
  d.saved = Date.now();
  if (d.promo) {
    const info = findCode(d.promo);
    if (info && info.kind === 'fid' && !codeProblem(info, d, 0)) info.m.usedBy = d.id;
  }
  syncClients();
  let msg = 'Devis ' + d.numero + ' enregistr\u00E9';
  if (needsDelivery(d)) {
    const dl = getDel(d);
    dl.date = d.livrDate || dl.date;
    dl.heure = d.livrHeure || '';
    if (dl.statut === 'plan' && dl.date) dl.statut = 'prog';
    dl.hist.push({ t: Date.now(), m: 'Devis enregistr\u00E9' + (dl.date ? ' \u2014 livraison le ' + dateFr(dl.date) + (dl.heure ? ' \u00E0 ' + dl.heure : '') : '') });
    msg += dl.date ? ' \u00B7 livraison le ' + dateFr(dl.date) + (dl.heure ? ' \u00E0 ' + dl.heure : '') : ' \u00B7 livraison \u00E0 planifier';
  }
  save();
  formOpen = false; currentId = 0;
  showTab('dos'); render();
  toast(msg);
}

/* ---------- S\u00E9lection d'un client enregistr\u00E9 depuis un devis ---------- */
function clientPicker(d) {
  const linked = d.clientId ? db.clients.filter(x => x.id === d.clientId)[0] : null;
  let h = '<div class="cpick">';
  if (linked) {
    const st = clientStats(linked);
    h += '<div class="cpl"><span>' + SVG.user + '<b>' + esc(linked.nom) + '</b> \u00B7 client enregistr\u00E9 ' + tierBadge(st.tier) + ' <span style="color:var(--i2)">' + st.pts.toLocaleString('fr-FR') + ' pts</span></span>' +
      '<button class="b s o" onclick="unlinkClient()">Changer de client</button></div>';
  } else {
    if (db.clients.length) {
      h += '<label>Client d\u00E9j\u00E0 enregistr\u00E9 ? <span class="opt">\u2014 recherchez par nom, t\u00E9l\u00E9phone, e-mail ou ville</span></label>' +
        '<input id="cli_find" placeholder="Rechercher un client\u2026" autocomplete="off" oninput="findClients(this.value)" onfocus="findClients(this.value)">' +
        '<div id="cli_res" class="cres"></div>';
    }
    h += '<div class="acts" style="margin-top:' + (db.clients.length ? '10' : '0') + 'px"><button class="b s o" onclick="saveAsClient()">' + SVG.plus + 'Enregistrer comme client</button>' +
      '<span class="sub" style="margin:0;align-self:center">Facultatif : la fiche (et ses points fid\u00E9lit\u00E9) n\u2019est cr\u00E9\u00E9e que si vous le demandez.</span></div>';
  }
  return h + '</div>';
}
function findClients(qs) {
  const box = document.getElementById('cli_res'); if (!box) return;
  const k = norm(qs).trim();
  let list = db.clients.filter(c => !k || norm([c.nom, c.tel, c.mail, c.ville, c.cp].join(' ')).indexOf(k) > -1);
  list = list.sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 6);
  box.style.display = 'block';
  box.innerHTML = list.length ? list.map(c => '<button type="button" onclick="pickClient(' + c.id + ')"><b>' + esc(c.nom) + '</b><span>' +
    esc([c.tel, c.mail, [c.cp, c.ville].filter(Boolean).join(' ')].filter(Boolean).join(' \u00B7 ') || 'Aucune coordonn\u00E9e') + '</span></button>').join('') : '<div class="none">Aucun client ne correspond. Remplissez les champs ci-dessous.</div>';
}
function pickClient(id) {
  const d = current(); const c = db.clients.filter(x => x.id === id)[0]; if (!d || !c) return;
  ['nom', 'tel', 'mail', 'adresse', 'cp', 'ville'].forEach(k => d.client[k] = c[k] || '');
  d.clientId = c.id; save(); render();
  const r = clientStats(c).tier.r;
  toast('Informations de ' + c.nom + ' reprises' + (r ? ' \u2014 remise fid\u00E9lit\u00E9 ' + r + ' % possible' : ''));
}
function unlinkClient() { const d = current(); if (!d) return; delete d.clientId; save(); render(); focusSoon('cli_find'); }
function saveAsClient() {
  const d = current(); if (!d) return;
  if (!String(d.client.nom || '').trim()) { toast('Indiquez d\u2019abord le nom du client'); focusSoon('f_client'); return; }
  const k = cKey(d.client);
  const ex = db.clients.filter(x => cKey(x) === k)[0];
  if (ex) { d.clientId = ex.id; save(); render(); toast('Cette personne a d\u00E9j\u00E0 une fiche : dossier rattach\u00E9'); return; }
  const c = { id: Date.now(), nom: d.client.nom, tel: d.client.tel, mail: d.client.mail, adresse: d.client.adresse, cp: d.client.cp, ville: d.client.ville,
    notes: '', created: Date.now(), mouv: [], tags: '', naissance: '', optin: 1 };
  if (db.loyalty.bonus) c.mouv.push({ t: Date.now(), pts: +db.loyalty.bonus, m: 'Bonus de bienvenue' });
  db.clients.push(c); d.clientId = c.id; save(); render();
  toast('Fiche client cr\u00E9\u00E9e pour ' + c.nom);
}

/* ---------- Démarrage ---------- */
(function init() {
  const bi = document.getElementById('brandimg');
  if (bi && typeof LOGO !== 'undefined') bi.src = LOGO;
  render();
  showTab('dos');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('beforeunload', save);
})();

</script></body></html>
